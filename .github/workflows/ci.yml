name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/python-ci.yml@v1
    with:
      test-command: "python -m unittest discover -s tests -v"

  # The reusable job runs Python 3.13 only, and the skill promises Python 3.9 and later.
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  release:
    needs: [security, ci, compat]
    permissions:
      contents: write
    uses: okamyuji/reusable-workflows/.github/workflows/semver-tag.yml@v1
